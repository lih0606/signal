        // 2. CSV 파싱 함수 (주소 내 쉼표 등 따옴표로 묶인 데이터 처리)
        function parseCSV(str) {
            const result = [];
            let row = [];
            let inQuotes = false;
            let val = '';
            for (let i = 0; i < str.length; i++) {
                const char = str[i];
                if (char === '"') {
                    if (inQuotes && str[i+1] === '"') { val += '"'; i++; } // 이스케이프된 따옴표
                    else { inQuotes = !inQuotes; }
                } else if (char === ',' && !inQuotes) {
                    row.push(val.trim()); val = '';
                } else if (char === '\n' && !inQuotes) {
                    row.push(val.trim()); result.push(row); row = []; val = '';
                } else if (char === '\r' && !inQuotes) {
                    // 무시
                } else {
                    val += char;
                }
            }
            row.push(val.trim());
            result.push(row);
            
            const headers = result[0];
            return result.slice(1).filter(r => r.length > 1 || r[0] !== '').map(r => {
                const obj = {};
                headers.forEach((h, i) => obj[h] = r[i]);
                return obj;
            });
        }

        // 3. 주소를 좌표로 변환 (Geocoding API)
        async function getCoordinatesFromAddress(address) {
            // 상세 주소(층, 호수)를 제외하고 도로명까지만 추출하여 검색 정확도 향상
            const cleanAddress = address.split(',')[0].replace(/ \d+층$/, '').replace(/ 제?\d+호$/, '').trim();
            // 지역명(인천 서구)를 붙여 검색
            const query = `인천 서구 ${cleanAddress}`;
            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                if (data && data.length > 0) {
                    return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
                }
            } catch (error) {
                console.error('Geocoding 오류:', error);
            }
            return null;
        }

        // 4. 지도 초기화
        const map = L.map('map').setView([37.515, 126.680], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        let markersLayer = L.featureGroup().addTo(map); // 마커들을 그룹으로 묶어 관리
        let markersData = []; // 필터링을 위해 마커 객체와 데이터를 함께 저장하는 배열

        // 5. 마커 렌더링 함수
        async function renderMarkers(facilities) {
            markersLayer.clearLayers(); // 기존 마커 초기화
            markersData = []; // 데이터 초기화

            for (const fac of facilities) {
                let lat = parseFloat(fac['위도']);
                let lng = parseFloat(fac['경도']);
                
                // 위도/경도가 없으면 주소를 통해 좌표 검색 (Geocoding)
                if (isNaN(lat) || isNaN(lng)) {
                    const address = fac['주소'];
                    if (!address) continue;
                    
                    // API 호출 제한 방지를 위해 1초 간격 대기
                    await new Promise(resolve => setTimeout(resolve, 1000)); 
                    const coords = await getCoordinatesFromAddress(address);
                    
                    if (coords) {
                        lat = coords.lat;
                        lng = coords.lng;
                    } else {
                        console.warn(`좌표를 찾을 수 없습니다: ${fac['시설명']} (${address})`);
                        continue; // 좌표를 못 찾으면 스킵
                    }
                }

                const capacity = parseInt(fac['정원']) || 0;
                const current = parseInt(fac['현원']) || 0;
                
                // 신호등 색상 로직 계산
                let color = '#94a3b8'; // 기본 회색
                if (capacity > 0) {
                    const ratio = current / capacity;
                    if (ratio >= 1) color = '#ef4444';      // 마감 (빨강)
                    else if (ratio >= 0.8) color = '#eab308'; // 주의 (노랑)
                    else color = '#22c55e';                 // 원활 (초록)
                }

                const marker = L.circleMarker([lat, lng], {
                    radius: 10,
                    fillColor: color,
                    color: '#ffffff',
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 0.95
                });

                // 마우스 올렸을 때(Hover) 나타나는 툴팁 (시설명, 현원/정원, 주소, 연락처)
                const tooltipContent = `
                    <div class="text-center mb-1">
                        <b>${fac['시설명']}</b> 
                        <span class="text-slate-500 font-bold ml-1">(${current}/${capacity > 0 ? capacity : '-'})</span>
                    </div>
                    <div class="text-left text-xs text-slate-600 mt-1 flex flex-col gap-1">
                        <span class="flex items-start gap-1"><i class="fa-solid fa-location-dot mt-0.5 w-3 text-center"></i> ${fac['주소']}</span>
                        <span class="flex items-center gap-1"><i class="fa-solid fa-phone w-3 text-center"></i> ${fac['문의처'] || '정보없음'}</span>
                    </div>
                `;
                
                marker.bindTooltip(tooltipContent, {
                    direction: 'top',
                    className: 'custom-tooltip',
                    offset: [0, -10]
                });

                markersLayer.addLayer(marker);
                
                // 마커와 타입 정보를 배열에 저장 (필터링용)
                markersData.push({
                    type: fac['구분'],
                    marker: marker
                });
            }
            
            // 데이터가 지도에 전부 들어오게 화면 확대 범위 자동 조절
            if (markersLayer.getLayers().length > 0) {
                map.fitBounds(markersLayer.getBounds(), { padding: [50, 50], maxZoom: 15 });
            }
        }

        // 6. 필터 변경 함수
        function setFilter(selectedType) {
            // 버튼 스타일 업데이트 (선택된 버튼 파란색, 나머지 흰색)
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if (btn.id === 'filter-' + selectedType) {
                    btn.classList.remove('border-slate-200', 'bg-white', 'text-slate-600');
                    btn.classList.add('border-blue-500', 'bg-blue-50', 'text-blue-700');
                } else {
                    btn.classList.add('border-slate-200', 'bg-white', 'text-slate-600');
                    btn.classList.remove('border-blue-500', 'bg-blue-50', 'text-blue-700');
                }
            });

            markersLayer.clearLayers(); // 지도에서 마커 모두 제거
            
            let bounds = L.latLngBounds();
            let visibleCount = 0;

            // 선택된 타입에 맞는 마커만 다시 추가
            markersData.forEach(item => {
                if (selectedType === '전체' || item.type === selectedType) {
                    markersLayer.addLayer(item.marker);
                    bounds.extend(item.marker.getLatLng());
                    visibleCount++;
                }
            });

            // 필터링된 마커 기준으로 지도 영역 재조정
            if (visibleCount > 0) {
                map.fitBounds(bounds, { padding: [50, 50], maxZoom: 15 });
            }
        }

        // 처음 로딩 시 데이터 렌더링
        const initialFacilities = parseCSV(csvData);
        renderMarkers(initialFacilities);
        
    </script>
