    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Kakao Map API -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=64100a23b3cbace78036575e32cfec9a&libraries=services"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
<!-- ... existing code ... -->
        .custom-tooltip {
            font-family: 'Noto Sans KR', sans-serif;
            padding: 8px 12px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            background-color: white;
            border: 1px solid #e2e8f0;
            color: #334155;
            font-size: 0.875rem;
            line-height: 1.5;
            white-space: nowrap; /* 툴팁 줄바꿈 방지 */
        }
        .custom-tooltip b { color: #0f172a; font-size: 1rem; }
    </style>
</head>
<body class="flex flex-col min-h-screen bg-slate-50">
<!-- ... existing code ... -->
    <!-- 모바일용 범례 (작은 화면에서만 보임) -->
    <div class="md:hidden flex justify-around text-xs bg-slate-100 px-2 py-3 border-b border-slate-200 z-10 relative font-medium">
        <span class="flex items-center gap-1"><div class="w-2.5 h-2.5 rounded-full bg-green-500"></div> 원활</span>
        <span class="flex items-center gap-1"><div class="w-2.5 h-2.5 rounded-full bg-yellow-400"></div> 주의</span>
        <span class="flex items-center gap-1"><div class="w-2.5 h-2.5 rounded-full bg-red-500"></div> 마감</span>
    </div>

    <!-- 지도 컨테이너 -->
    <div id="map" class="w-full relative">
        <!-- 배경 로딩 메시지 -->
        <div class="absolute inset-0 flex flex-col items-center justify-center bg-slate-100 text-slate-500 p-6 text-center z-[-1]">
            <i class="fa-solid fa-spinner fa-spin text-4xl mb-4 text-blue-400"></i>
            <p class="font-bold text-lg mb-2">지도를 불러오는 중입니다...</p>
            <p class="text-sm">계속 로딩 중이라면 카카오 디벨로퍼스(플랫폼 설정)에 도메인이 올바르게 등록되었는지 확인해주세요.</p>
        </div>
    </div>

    <script>
        // 1. 데이터 입력 (각 기관 범례에 맞게 추가됨)
        const csvData = `구분,시설명,주소,문의처,위도,경도,정원,현원
초등돌봄교실,인천가림초등학교,장고개로293번길 29,032-571-6230,37.49058351,126.6810501,40,15
초등돌봄교실,인천가석초등학교,서달로 174,032-583-0271,37.51475728,126.6796755,40,35
지역아동센터,성문 지역아동센터,서달로 126,032-579-5545,,,19,19
지역아동센터,심곡 지역아동센터,"승학로 278, 301호",032-562-0691,,,33,28
다함께돌봄센터,서구 다함께돌봄센터 1호점,가정로 152,032-111-2222,37.5185,126.6751,20,18
청소년방과후아카데미,서구청소년센터,원창로 92,032-333-4444,37.5251,126.6701,40,45`;

        // 2. CSV 파싱 함수
        function parseCSV(str) {
            const result = [];
            let row = [];
            let inQuotes = false;
            let val = '';
            for (let i = 0; i < str.length; i++) {
                const char = str[i];
                if (char === '"') {
                    if (inQuotes && str[i+1] === '"') { val += '"'; i++; }
                    else { inQuotes = !inQuotes; }
                } else if (char === ',' && !inQuotes) {
                    row.push(val.trim()); val = '';
                } else if (char === '\n' && !inQuotes) {
                    row.push(val.trim()); result.push(row); row = []; val = '';
                } else if (char === '\r' && !inQuotes) {
                    // 무시
                } else {
                    val += char;
                }
            }
            row.push(val.trim());
            result.push(row);
            
            const headers = result[0];
            return result.slice(1).filter(r => r.length > 1 || r[0] !== '').map(r => {
                const obj = {};
                headers.forEach((h, i) => obj[h] = r[i]);
                return obj;
            });
        }

        // 전역 변수로 지도, 지오코더, 마커 데이터 선언
        let map;
        let geocoder;
        let markersData = [];

        // 3. 주소를 좌표로 변환하는 함수 (Promise 래퍼)
        function getCoordinatesFromAddress(address) {
            return new Promise((resolve) => {
                if (!geocoder) { resolve(null); return; }
                const cleanAddress = address.split(',')[0].replace(/ \d+층$/, '').replace(/ 제?\d+호$/, '').trim();
                geocoder.addressSearch(cleanAddress, function(result, status) {
                    if (status === kakao.maps.services.Status.OK) {
                        resolve({ lat: parseFloat(result[0].y), lng: parseFloat(result[0].x) });
                    } else {
                        resolve(null);
                    }
                });
            });
        }

        // 4. 마커 렌더링 함수
        async function renderMarkers(facilities) {
            markersData.forEach(item => {
                item.marker.setMap(null);
                item.tooltip.setMap(null);
            });
            markersData = [];

            let bounds = new kakao.maps.LatLngBounds();
            let hasValidMarkers = false;

            for (const fac of facilities) {
                let lat = parseFloat(fac['위도']);
                let lng = parseFloat(fac['경도']);
                
                // 위도/경도가 없으면 주소를 통해 카카오 지오코딩 API 검색
                if (isNaN(lat) || isNaN(lng)) {
                    const address = fac['주소'];
                    if (!address) continue;
                    
                    const coords = await getCoordinatesFromAddress(address);
                    
                    if (coords) {
                        lat = coords.lat;
                        lng = coords.lng;
                    } else {
                        console.warn(`좌표를 찾을 수 없습니다: ${fac['시설명']} (${address})`);
                        continue; 
                    }
                }

                const capacity = parseInt(fac['정원']) || 0;
                const current = parseInt(fac['현원']) || 0;
                
                let color = '#94a3b8'; // 기본 회색
                if (capacity > 0) {
                    const ratio = current / capacity;
                    if (ratio >= 1) color = '#ef4444';      // 마감 (빨강)
                    else if (ratio >= 0.8) color = '#eab308'; // 주의 (노랑)
                    else color = '#22c55e';                 // 원활 (초록)
                }

                const position = new kakao.maps.LatLng(lat, lng);

                const markerDOM = document.createElement('div');
                markerDOM.className = 'w-5 h-5 rounded-full border-2 border-white cursor-pointer shadow-[0_2px_4px_rgba(0,0,0,0.3)] transition-transform hover:scale-110';
                markerDOM.style.backgroundColor = color;

                const marker = new kakao.maps.CustomOverlay({
                    position: position,
                    content: markerDOM,
                    yAnchor: 0.5,
                    xAnchor: 0.5,
                    zIndex: 1
                });

                const tooltipContent = `
                    <div class="custom-tooltip mb-3">
                        <div class="text-center mb-1">
                            <b>${fac['시설명']}</b> 
                            <span class="text-slate-500 font-bold ml-1">(${current}/${capacity > 0 ? capacity : '-'})</span>
                        </div>
                        <div class="text-left text-xs text-slate-600 mt-1 flex flex-col gap-1">
                            <span class="flex items-start gap-1"><i class="fa-solid fa-location-dot mt-0.5 w-3 text-center"></i> <span class="break-keep">${fac['주소']}</span></span>
                            <span class="flex items-center gap-1"><i class="fa-solid fa-phone w-3 text-center"></i> ${fac['문의처'] || '정보없음'}</span>
                        </div>
                    </div>
                `;
                
                const tooltip = new kakao.maps.CustomOverlay({
                    position: position,
                    content: tooltipContent,
                    yAnchor: 1, 
                    xAnchor: 0.5,
                    zIndex: 10
                });

                markerDOM.addEventListener('mouseenter', () => tooltip.setMap(map));
                markerDOM.addEventListener('mouseleave', () => tooltip.setMap(null));

                marker.setMap(map);
                bounds.extend(position);
                hasValidMarkers = true;
                
                markersData.push({
                    type: fac['구분'],
                    marker: marker,
                    tooltip: tooltip,
                    position: position
                });
            }
            
            if (hasValidMarkers) {
                map.setBounds(bounds);
            }
        }

        // 5. 필터 변경 함수
        function setFilter(selectedType) {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if (btn.id === 'filter-' + selectedType) {
                    btn.classList.remove('border-slate-200', 'bg-white', 'text-slate-600');
                    btn.classList.add('border-blue-500', 'bg-blue-50', 'text-blue-700');
                } else {
                    btn.classList.add('border-slate-200', 'bg-white', 'text-slate-600');
                    btn.classList.remove('border-blue-500', 'bg-blue-50', 'text-blue-700');
                }
            });

            let bounds = new kakao.maps.LatLngBounds();
            let visibleCount = 0;

            markersData.forEach(item => {
                if (selectedType === '전체' || item.type === selectedType) {
                    item.marker.setMap(map);
                    bounds.extend(item.position);
                    visibleCount++;
                } else {
                    item.marker.setMap(null);
                    item.tooltip.setMap(null);
                }
            });

            if (visibleCount > 0) {
                map.setBounds(bounds);
            }
        }

        // 6. 애플리케이션 초기화 (카카오맵 API 완전 로드 대기)
        function initApp() {
            // 카카오 객체가 없거나 서비스가 아직 준비되지 않았다면 100ms 후 재시도
            if (typeof kakao === 'undefined' || !kakao.maps || !kakao.maps.services) {
                setTimeout(initApp, 100);
                return;
            }

            kakao.maps.load(function() {
                // 지도 생성 (이 시점에서는 카카오맵 로드가 100% 보장됨)
                const mapContainer = document.getElementById('map');
                const mapOption = { 
                    center: new kakao.maps.LatLng(37.515, 126.680),
                    level: 6 
                };
                map = new kakao.maps.Map(mapContainer, mapOption);
                
                // 주소 변환기 생성
                geocoder = new kakao.maps.services.Geocoder();

                // 데이터 렌더링 시작
                const initialFacilities = parseCSV(csvData);
                renderMarkers(initialFacilities);
            });
        }

        // 스크립트 실행 시작
        initApp();
        
    </script>
</body>
</html>
